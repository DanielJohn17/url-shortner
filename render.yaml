services:
  - type: web
    name: url-shortner-api
    runtime: go
    rootDir: api
    buildCommand: go build -o bin/server ./cmd/main
    startCommand: ./bin/server
    envVars:
      # --- Postgres ---
      # Option A (Neon / any URL): set DATABASE_URL, leave DB_* empty.
      - key: DATABASE_URL
        sync: false
      # Option B (individual fields): leave DATABASE_URL unset.
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "5432"

      # --- Redis ---
      # Option A (Upstash TCP URL): set REDIS_URL, leave REDIS_* empty.
      - key: REDIS_URL
        sync: false
      # Option B (individual fields): leave REDIS_URL unset.
      - key: REDIS_ADDR
        sync: false
      - key: REDIS_PASS
        sync: false
      - key: REDIS_DB
        value: "0"
      - key: REDIS_PROTOCOL
        value: "3"
      - key: REDIS_EXP_IN_SECONDS
        value: "86400"
      - key: REDIS_MAX_IDLE_CONNS
        value: "10"
      - key: REDIS_MAX_ACTIVE_CONNS
        value: "100"

      # --- App ---
      - key: FRONTEND_URL
        sync: false   # Vercel frontend URL
      - key: ALLOWED_ORIGINS
        sync: false   # Vercel URL
      # PORT is injected automatically by Render
